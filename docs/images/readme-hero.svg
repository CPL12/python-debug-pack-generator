<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Python Debug Pack Generator preview</title>
  <desc id="desc">A stylized app preview showing a lesson prompt, generated code, debug cards, and runner output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7faf6"/>
      <stop offset="0.5" stop-color="#e8f3ee"/>
      <stop offset="1" stop-color="#f4efe3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#1f7a5d"/>
      <stop offset="1" stop-color="#2f69a1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#143326" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g transform="translate(70 64)">
    <text x="0" y="0" fill="#183327" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Python Debug Pack Generator</text>
    <text x="0" y="42" fill="#5f7168" font-family="Segoe UI, Arial, sans-serif" font-size="22">Turn one lesson idea into code, debug cards, and a runnable classroom demo.</text>
  </g>
  <g transform="translate(70 140)" filter="url(#shadow)">
    <rect width="1140" height="420" rx="18" fill="#ffffff"/>
    <rect width="1140" height="58" rx="18" fill="#17201a"/>
    <circle cx="32" cy="29" r="7" fill="#ff726f"/>
    <circle cx="56" cy="29" r="7" fill="#ffcc66"/>
    <circle cx="80" cy="29" r="7" fill="#70d77b"/>
    <text x="110" y="37" fill="#dfece5" font-family="Consolas, monospace" font-size="18">localhost:8000</text>
    <g transform="translate(28 86)">
      <rect width="270" height="292" rx="12" fill="#f6f8f5" stroke="#d9e0d8"/>
      <text x="22" y="38" fill="#1f3529" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Lesson topic</text>
      <rect x="22" y="58" width="226" height="82" rx="10" fill="#ffffff" stroke="#cfd8d1"/>
      <text x="38" y="92" fill="#506258" font-family="Segoe UI, Arial, sans-serif" font-size="17">Number guessing game</text>
      <rect x="22" y="164" width="226" height="44" rx="10" fill="#ffffff" stroke="#cfd8d1"/>
      <text x="38" y="192" fill="#506258" font-family="Segoe UI, Arial, sans-serif" font-size="16">Junior secondary</text>
      <rect x="22" y="226" width="226" height="46" rx="12" fill="url(#accent)"/>
      <text x="52" y="256" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Generate Debug Pack</text>
    </g>
    <g transform="translate(330 86)">
      <rect width="350" height="292" rx="12" fill="#111816"/>
      <text x="24" y="38" fill="#73daca" font-family="Consolas, monospace" font-size="18">def play_game():</text>
      <text x="24" y="72" fill="#c3e88d" font-family="Consolas, monospace" font-size="18">    secret = 7</text>
      <text x="24" y="106" fill="#89ddff" font-family="Consolas, monospace" font-size="18">    guess = int(input())</text>
      <rect x="18" y="124" width="314" height="38" rx="8" fill="#493b18"/>
      <text x="24" y="150" fill="#ff9f5a" font-family="Consolas, monospace" font-size="18">    if guess = secret:</text>
      <text x="24" y="190" fill="#e6f0ea" font-family="Consolas, monospace" font-size="18">        print("Correct!")</text>
      <text x="24" y="250" fill="#8aa096" font-family="Consolas, monospace" font-size="16">Syntax evidence highlighted</text>
    </g>
    <g transform="translate(710 86)">
      <rect width="190" height="132" rx="12" fill="#ecf7f1" stroke="#b9d8ca"/>
      <text x="20" y="36" fill="#1f6d55" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Debug Card</text>
      <text x="20" y="70" fill="#345044" font-family="Segoe UI, Arial, sans-serif" font-size="15">Use == to compare</text>
      <text x="20" y="98" fill="#61756b" font-family="Segoe UI, Arial, sans-serif" font-size="14">Line 4 is the clue.</text>
      <rect y="160" width="190" height="132" rx="12" fill="#eff5fb" stroke="#bdd0e6"/>
      <text x="20" y="196" fill="#235a8f" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Runner</text>
      <text x="20" y="230" fill="#345044" font-family="Consolas, monospace" font-size="15">&gt; 7</text>
      <text x="20" y="258" fill="#9f2d2d" font-family="Consolas, monospace" font-size="15">SyntaxError</text>
    </g>
    <g transform="translate(930 86)">
      <rect width="174" height="292" rx="12" fill="#fff8e9" stroke="#ead7aa"/>
      <text x="20" y="36" fill="#8a5b07" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Lesson Flow</text>
      <circle cx="30" cy="74" r="8" fill="#1f7a5d"/>
      <line x1="30" y1="88" x2="30" y2="222" stroke="#c9b782" stroke-width="3"/>
      <circle cx="30" cy="132" r="8" fill="#2f69a1"/>
      <circle cx="30" cy="190" r="8" fill="#9a6400"/>
      <text x="52" y="80" fill="#4f5f56" font-family="Segoe UI, Arial, sans-serif" font-size="15">Warm-up</text>
      <text x="52" y="138" fill="#4f5f56" font-family="Segoe UI, Arial, sans-serif" font-size="15">Build</text>
      <text x="52" y="196" fill="#4f5f56" font-family="Segoe UI, Arial, sans-serif" font-size="15">Debug</text>
      <text x="20" y="258" fill="#6d6146" font-family="Segoe UI, Arial, sans-serif" font-size="14">Ready for class</text>
    </g>
  </g>
</svg>
